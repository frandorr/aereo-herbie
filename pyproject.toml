[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aereo-herbie-workspace"
version = "1.0.0"
description = "aereo plugin for NWP model data discovery and reading via Herbie GRIB2 index files"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["satellite", "remote-sensing", "earth-observation", "aereo", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
authors = [{ name = "Fran Dorr" }]
dependencies = [
    "aereo",
    "herbie-data>=2026.3.0",
]

[project.urls]
Homepage = "https://github.com/frandorr/aereo-plugin-template"
Repository = "https://github.com/frandorr/aereo-plugin-template"
Issues = "https://github.com/frandorr/aereo-plugin-template/issues"
Documentation = "https://frandorr.github.io/aereo-plugin-template"

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["projects/*"]

[tool.uv.sources]
aereo = { path = "../aereo/projects/aereo", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    ".venv",
    "./development/*.py",
]
line-length = 120

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["components/", "bases/"]

[dependency-groups]
dev = [
    "polylith-cli>=1.49.1",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6",
    "python-semantic-release>=10.6.1",
]
[tool.coverage]
run.branch = true
run.source = [ "src" ]
run.omit = [
  "*/test*",
  "*/__pycache__/*",
  "*/.venv/*",
  "*/site/*",
  "*/dist/*",
  "*/build/*",
  "*/development/*",
]
report.show_missing = true
report.skip_covered = false
report.fail_under = 0
report.exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
html.directory = "htmlcov"
